# 控制面（SANDBOX_BACKEND=k8s）需要的权限：只碰 Pod 与 PVC，不碰节点。
#
# 控制面自己就是调度器：它为每个空间建 / 删空间容器，为每个租户建 / 删插件容器。
# 不需要 CRD、不需要 Operator、不需要 DaemonSet。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wa-controlplane
  namespace: workagent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wa-executor-manager
  namespace: workagent
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # 直连 Pod IP 不通时（控制面在集群外），执行面会退回经 API Server 的端口转发。
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # 读令牌 Secret 不需要：Pod 通过 secretKeyRef 注入，控制面不解析它。
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wa-controlplane-executor-manager
  namespace: workagent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wa-executor-manager
subjects:
  - kind: ServiceAccount
    name: wa-controlplane
    namespace: workagent
