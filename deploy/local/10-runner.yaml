# 执行体：容器内的 bwrap 宿主。
#
# 安全上下文说明（每一项都有理由，别随手删）：
#   SYS_ADMIN —— bwrap 要做 bind mount / proc / dev / tmpfs
#   NET_ADMIN —— bwrap --unshare-net 后要拉起 lo，缺了会报
#                "loopback: Failed RTM_NEWADDR: No child processes"
#   seccompProfile: Unconfined —— 默认 RuntimeDefault 会拦 unshare/clone(CLONE_NEW*)
#   没有给 privileged —— 上述两项能力已足够，privileged 会把节点设备全暴露
#
# 存储：本地单节点用 hostPath（OrbStack VM 内的 ext4）；生产换成每租户一个
# local PV，挂载点必须与控制面看到的绝对路径完全一致（路径是跨进程契约）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-runner
  namespace: workagent
  labels:
    app.kubernetes.io/name: sandbox-runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandbox-runner
    spec:
      terminationGracePeriodSeconds: 60
      # subPath 挂载要求目标目录在 volume 里已经存在，否则 Pod 起不来
      # （CreateContainerConfigError）。
      initContainers:
        - name: init-cache
          image: busybox:1.36
          command:
            - sh
            - -c
            - mkdir -p /cache/apt/lists /cache/apt/archives /cache/npm /cache/pip /cache/go/mod /cache/deno /cache/xdg
          volumeMounts:
            - name: cache
              mountPath: /cache
      containers:
        - name: runner
          image: workagent/sandbox-runner:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8323
          env:
            - name: SANDBOX_REQUIRE
              value: "true"
            - name: SANDBOX_AGENT_ROOT
              value: /var/lib/workagent
            # 租户级缓存根目录：与下面的 volumeMount 必须一致。
            # apt 的索引与 deb、npm / pip / go 的下载、Deno 的 DENO_DIR 都落在这里。
            - name: WA_CACHE_DIR
              value: /cache
            - name: SANDBOX_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sandbox-runner-token
                  key: token
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            seccompProfile:
              type: Unconfined
            capabilities:
              add: ["SYS_ADMIN", "NET_ADMIN"]
          volumeMounts:
            - name: storage
              mountPath: /var/lib/workagent
            # 租户级缓存：apt 索引与 deb、npm / pip / go 下载、Deno 的 DENO_DIR。
            # 漏挂的表现是「装过的包重建后又要联网下载」，
            # 而且 apt 会报 "Unable to locate package"——像包不存在，其实是索引没了。
            - name: cache
              mountPath: /cache
            # apt 的索引和 deb 单独挂到持久盘。
            #
            # 漏挂 lists 时，deb 就在 /cache 里，`apt install` 却报
            # "Unable to locate package"——apt 靠自己的索引解析包名，
            # 没有索引就不知道 ffmpeg 对应哪个文件。这个报错和
            # "确实没这个包"完全一样，很难查。
            - name: cache
              mountPath: /var/lib/apt/lists
              subPath: apt/lists
            - name: cache
              mountPath: /var/cache/apt/archives
              subPath: apt/archives
      volumes:
        - name: storage
          hostPath:
            path: /var/lib/workagent
            type: DirectoryOrCreate
        - name: cache
          hostPath:
            path: /var/cache/workagent
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-runner
  namespace: workagent
spec:
  selector:
    app.kubernetes.io/name: sandbox-runner
  ports:
    - name: http
      port: 8323
      targetPort: http
