# 部署后验：用与线上一致的 Spec 形状打一遍执行体。
# 这不是「能不能起来」的检查，而是「能不能上线」的检查：
# 能跑、能写自己空间、写不了系统目录、断网、宿主路径不可见、超时生效。
apiVersion: batch/v1
kind: Job
metadata:
  name: sandbox-probe
  namespace: workagent
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: probe
          image: workagent/sandbox-runner:dev
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/sandbox-probe
            - -addr=http://sandbox-runner:8323
            # 相对执行体存储根的 key；目录由执行体自己创建，探针不需要挂载
            - -space=spaces/probe/files
          env:
            - name: SANDBOX_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sandbox-runner-token
                  key: token
          # 探针只调执行体的 HTTP 接口，自己不需要任何卷：
          # 工作区由执行体按 key 解析并创建。
