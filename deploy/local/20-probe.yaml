# 部署后验：用与线上一致的 Spec 形状打一遍执行体。
# 这不是「能不能起来」的检查，而是「能不能上线」的检查：
# 能跑、能写自己空间、写不了系统目录、断网、看不到同级空间、超时生效。
apiVersion: batch/v1
kind: Job
metadata:
  name: sandbox-probe
  namespace: workagent
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: probe
          image: workagent/sandbox-runner:dev
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/sandbox-probe
            - -addr=http://sandbox-runner:8323
            - -space=/var/lib/workagent/storage/tenants/default/spaces/probe/files
          env:
            - name: SANDBOX_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sandbox-runner-token
                  key: token
          volumeMounts:
            # 探针要自己建目录：它和 runner 看的是同一个 hostPath
            - name: storage
              mountPath: /var/lib/workagent
      volumes:
        - name: storage
          hostPath:
            path: /var/lib/workagent
            type: DirectoryOrCreate
