services:
  postgres:
    image: postgres:16-alpine
    container_name: autoagent-pg
    environment:
      POSTGRES_USER: autoagent
      POSTGRES_PASSWORD: autoagent
      POSTGRES_DB: autoagent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoagent -d autoagent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
